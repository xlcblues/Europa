[package]
name = "europa"
version = "1.1.1"
description = "Europa desktop arcade"
authors = ["Europa Project"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "europa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-updater = "=2.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

